name: ⚙️ Update ebuilds

on:
  # Run every 3 hours
  schedule:
    - cron: '30 */3 * * *'
  workflow_dispatch:

jobs:
  update-ebuilds:
    name: Update ebuilds
    runs-on: ubuntu-latest
    permissions:
      # Required to push changes to repo
      contents: write

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v6

      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update ebuilds
        id: update-ebuilds
        run: python scripts/update_ebuilds.py -v --update --commit --step-summary

      # This fork has no test pipeline, so old ebuilds are pruned right away,
      # keeping only the newest version of each package.
      - name: Prune ebuilds
        run: python scripts/update_ebuilds.py -v --prune --commit --step-summary

      - name: Push changes
        run: git push
